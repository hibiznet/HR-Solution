spring:
  config:
    activate:
      on-profile: mariadb

  datasource:
    url: jdbc:mariadb://mariadb-host:3306/hrdb?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    enabled: true
    locations: classpath:db/migration/mariadb

security:
  jwt:
    issuer: hibiznet-hr
    secret: ${JWT_SECRET_BASE64}
    access-token-expire-seconds: 3600
    refresh-token-expire-seconds: 1209600
