spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mariadb://localhost:3306/hrdb?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: hr_user
    password: hr_pass
    driver-class-name: org.mariadb.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    enabled: true
    locations: classpath:db/migration/mariadb

file:
  upload-dir: /data/hr/uploads

security:
  jwt:
    issuer: hibiznet-hr
    secret: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdCYXNlNjRTZWNyZXRLZXlGb3JIUjEyMzQ1Njc4OTA=
    access-token-expire-seconds: 3600
    refresh-token-expire-seconds: 1209600

app:
  security:
    allowed-origins:
      - http://localhost:5173
    secure-headers: true
